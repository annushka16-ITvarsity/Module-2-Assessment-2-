<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sizzle Kitchen | Meals | Margherita Pizza</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    </head>
    <body class="body-recipes">

        <div class="header">
            <a href="meals.html"><i class="fa-solid fa-chevron-left"></i></a>
            <img src="images/logo-text.png">
        </div>

        <div id="recipe">
            c<div class="recipe-details">

                <img src="images/margherita-pizza.jpg.jpg">
                <h1>Margherita Pizza</h1>

                <div class="recipe-details-info">
                    <p><b>Price</b>: R95</p>
                    <p style="float: right;"><b>Serving size</b>: 1 medium pizza (30 cm)</p>
                </div>

                <div class="recipe-details-about">
                    <h2>About this meal</h2>
                    <p>Thin and crispy base topped with rich tomato sauce, melted mozzarella and fresh basil. A classic for a reason.</p>
                </div>

                <form action="thanks.html">

                    <div class="recipe-details-extras">
                        <h2>Extras</h2>
                        <ul>
                            <li>
                                <input id="extra-01" type="checkbox" name="extras" value="Extra chips">
                                <label for="extra-01">Extra chips</label>
                                <span>+R20</span>
                            </li>
                            <li>
                                <input id="extra-02" type="checkbox" name="extras" value="Extra cheese slice">
                                <label for="extra-02">Extra cheese slice</label>
                                <span>+R8</span>
                            </li>
                            <li>
                                <input id="extra-03" type="checkbox" name="extras" value="Cold drink">
                                <label for="extra-03">Cold drink</label>
                                <span>+R18</span>
                            </li>
                            <li>
                                <input id="extra-04" type="checkbox" name="extras" value="Extra mushrooms">
                                <label for="extra-04">Extra mushrooms</label>
                                <span>+R12</span>
                            </li>
                            <li>
                                <input id="extra-05" type="checkbox" name="extras" value="Pineapple slice">
                                <label for="extra-05">Pineapple slice</label>
                                <span>+R5</span>
                            </li>
                        </ul>
                    </div>

                    <div class="recipe-details-notes">
                        <h2>Special requests</h2>
                        <textarea name="notes" rows="4" placeholder="E.g. no onions, extra spicy, allergies..."></textarea>
                    </div>

                    <button type="submit" class="order-button">Place Order</button>

                </form>

            </div>
        </div>

    </body>
</html>
