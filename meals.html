<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sizzle Kitchen | Meals</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    </head>
    <body class="body-meals">

        <div class="header">
            <a href="index.html"><i class="fa-solid fa-chevron-left"></i></a>
            <img src="images/logo-text.png">
        </div>

        <div id="meals">
            <h2>Meals</h2>
            <div id="meals-list">

                <a href="classic-burger.html">
                    <div class="meals-list-item">
                        <img src="images/classic-burger.jpg.jpg">
                        <div class="meals-list-text">
                            <h1>Classic Beef Burger</h1>
                            <p>A juicy beef burger</p>
                            <p class="price">R85</p>
                        </div>
                        <i class="fa-solid fa-chevron-right arrow"></i>
                    </div>
                </a>

                <a href="chicken-wrap.html">
                    <div class="meals-list-item">
                        <img src="images/chicken-wrap.jpg.jpg">
                        <div class="meals-list-text">
                            <h1>Crispy Chicken Wrap</h1>
                            <p>Crispy chicken in a warm wrap</p>
                            <p class="price">R70</p>
                        </div>
                        <i class="fa-solid fa-chevron-right arrow"></i>
                    </div>
                </a>

                <a href="margherita-pizza.html">
                    <div class="meals-list-item">
                        <img src="images/margherita-pizza.jpg.jpg">
                        <div class="meals-list-text">
                            <h1>Margherita Pizza</h1>
                            <p>Tomato, mozzarella and basil</p>
                            <p class="price">R95</p>
                        </div>
                        <i class="fa-solid fa-chevron-right arrow"></i>
                    </div>
                </a>

            </div>
        </div>

    </body>
</html>
