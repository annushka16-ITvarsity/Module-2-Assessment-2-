<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sizzle Kitchen | Drinks</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    </head>
    <body class="body-meals">

        <div class="header">
            <a href="index.html"><i class="fa-solid fa-chevron-left"></i></a>
            <img src="images/logo-text.png">
        </div>

        <div id="meals">
            <h2>Drinks</h2>
            <div id="meals-list">

                <a href="strawberry-milkshake.html">
                    <div class="meals-list-item">
                        <img src="images/strawberry-milkshake.jpg.jpg">
                        <div class="meals-list-text">
                            <h1>Strawberry Milkshake</h1>
                            <p>Creamy strawberry milkshake</p>
                            <p class="price">R45</p>
                        </div>
                        <i class="fa-solid fa-chevron-right arrow"></i>
                    </div>
                </a>

                <a href="fresh-lemonade.html">
                    <div class="meals-list-item">
                        <img src="images/fresh-lemonade.jpg.jpg">
                        <div class="meals-list-text">
                            <h1>Fresh Lemonade</h1>
                            <p>Freshly squeezed and ice cold</p>
                            <p class="price">R30</p>
                        </div>
                        <i class="fa-solid fa-chevron-right arrow"></i>
                    </div>
                </a>

                <a href="iced-coffee.html">
                    <div class="meals-list-item">
                        <img src="images/iced-coffee.jpg.jpg">
                        <div class="meals-list-text">
                            <h1>Iced Coffee</h1>
                            <p>Cold, smooth and sweet</p>
                            <p class="price">R38</p>
                        </div>
                        <i class="fa-solid fa-chevron-right arrow"></i>
                    </div>
                </a>

            </div>
        </div>

    </body>
</html>
