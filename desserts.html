<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sizzle Kitchen | Desserts</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    </head>
    <body class="body-meals">

        <div class="header">
            <a href="index.html"><i class="fa-solid fa-chevron-left"></i></a>
            <img src="images/logo-text.png">
        </div>

        <div id="meals">
            <h2>Desserts</h2>
            <div id="meals-list">

                <a href="chocolate-brownie.html">
                    <div class="meals-list-item">
                        <img src="images/chocolate-brownie.jpg.jpg">
                        <div class="meals-list-text">
                            <h1>Chocolate Brownie</h1>
                            <p>Rich and gooey chocolate</p>
                            <p class="price">R40</p>
                        </div>
                        <i class="fa-solid fa-chevron-right arrow"></i>
                    </div>
                </a>

                <a href="cheesecake.html">
                    <div class="meals-list-item">
                        <img src="images/cheesecake.jpg.jpg">
                        <div class="meals-list-text">
                            <h1>Cheesecake Slice</h1>
                            <p>Creamy cheesecake with berries</p>
                            <p class="price">R48</p>
                        </div>
                        <i class="fa-solid fa-chevron-right arrow"></i>
                    </div>
                </a>

                <a href="vanilla-ice-cream.html">
                    <div class="meals-list-item">
                        <img src="images/vanilla-ice-cream.jpg.jpg">
                        <div class="meals-list-text">
                            <h1>Vanilla Ice Cream</h1>
                            <p>Two scoops of vanilla</p>
                            <p class="price">R35</p>
                        </div>
                        <i class="fa-solid fa-chevron-right arrow"></i>
                    </div>
                </a>

            </div>
        </div>

    </body>
</html>
