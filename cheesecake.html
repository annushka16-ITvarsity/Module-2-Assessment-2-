<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sizzle Kitchen | Desserts | Cheesecake Slice</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    </head>
    <body class="body-recipes">

        <div class="header">
            <a href="desserts.html"><i class="fa-solid fa-chevron-left"></i></a>
            <img src="images/logo-text.png">
        </div>

        <div id="recipe">
            <div class="recipe-details">

                <img src="images/cheesecake.jpg.jpg">
                <h1>Cheesecake Slice</h1>

                <div class="recipe-details-info">
                    <p><b>Price</b>: R48</p>
                    <p style="float: right;"><b>Serving size</b>: 1 slice (150 g)</p>
                </div>

                <div class="recipe-details-about">
                    <h2>About this dessert</h2>
                    <p>Smooth baked cheesecake on a buttery biscuit base, finished with a sweet berry sauce.</p>
                </div>

                <form action="thanks.html">

                    <div class="recipe-details-extras">
                        <h2>Extras</h2>
                        <ul>
                            <li>
                                <input id="extra-01" type="checkbox" name="extras" value="Extra scoop of ice cream">
                                <label for="extra-01">Extra scoop of ice cream</label>
                                <span>+R12</span>
                            </li>
                            <li>
                                <input id="extra-02" type="checkbox" name="extras" value="Chocolate sauce">
                                <label for="extra-02">Chocolate sauce</label>
                                <span>+R6</span>
                            </li>
                            <li>
                                <input id="extra-03" type="checkbox" name="extras" value="Whipped cream">
                                <label for="extra-03">Whipped cream</label>
                                <span>+R6</span>
                            </li>
                            <li>
                                <input id="extra-04" type="checkbox" name="extras" value="Fresh strawberries">
                                <label for="extra-04">Fresh strawberries</label>
                                <span>+R10</span>
                            </li>
                        </ul>
                    </div>

                    <div class="recipe-details-notes">
                        <h2>Special requests</h2>
                        <textarea name="notes" rows="4" placeholder="E.g. no onions, extra spicy, allergies..."></textarea>
                    </div>

                    <button type="submit" class="order-button">Place Order</button>

                </form>

            </div>
        </div>

    </body>
</html>
